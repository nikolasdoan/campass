<!doctype html>
<html lang="zh-Hant-TW" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusPass 校園優惠</title>
<meta name="description" content="CampusPass 校園優惠整合平臺：把學校、學院與學生組織公告的特約優惠整理成一份可搜尋的清單，標示原公告單位與資料擷取日。">
<meta property="og:title" content="CampusPass 校園優惠">
<meta property="og:description" content="把學校與學生組織公告的特約優惠整理成一份可搜尋的清單。">
<meta property="og:type" content="website">
<meta property="og:image" content="/icons/icon-512.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202026" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CampusPass">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script src="/boot.js?v=10"></script>
<link rel="preload" href="/fonts/instrument-serif-italic-wordmark.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/noto-serif-tc-700-wordmark.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css?v=10">
<link rel="modulepreload" href="/js/i18n.js?v=10">
<link rel="modulepreload" href="/js/util.js?v=10">
<link rel="modulepreload" href="/js/icons.js?v=10">
<link rel="modulepreload" href="/js/ui.js?v=10">
<link rel="modulepreload" href="/js/qr.js?v=10">
<script type="module" src="/app.js?v=10"></script>
<script src="/pwa.js?v=10" defer></script>
</head>
<body data-route="explore">
<a class="skip" href="#main" data-i18n="skip">跳至主要內容</a>

<!-- Shared SVG defs: the CampusPass mark (same geometry as /icons/mark.svg), drawn in currentColor. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <mask id="cp-mark-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="86" y="146" width="340" height="220" rx="30" fill="#fff"/>
      <g fill="#000">
        <circle cx="322" cy="146" r="28"/><circle cx="322" cy="366" r="28"/>
        <circle cx="322" cy="200" r="9"/><circle cx="322" cy="238" r="9"/>
        <circle cx="322" cy="276" r="9"/><circle cx="322" cy="314" r="9"/>
        <rect x="132" y="210" width="128" height="26" rx="13"/><rect x="132" y="262" width="84" height="26" rx="13"/>
      </g>
    </mask>
    <symbol id="cp-mark" viewBox="66 96 380 320">
      <g transform="rotate(-12 256 256)"><rect width="512" height="512" fill="currentColor" mask="url(#cp-mark-cut)"/></g>
    </symbol>
  </defs>
</svg>

<!-- Desktop (≥821px): the 72px rail. -->
<nav class="rail" id="rail" aria-label="主選單" data-i18n-aria="nav.main">
  <a class="raillogo" href="/" data-nav aria-label="CampusPass 首頁" data-i18n-aria="home">
    <svg class="railmark" aria-hidden="true"><use href="#cp-mark"/></svg>
  </a>
  <div class="railtabs" id="railTabs">
    <a class="railtab" href="/" data-nav data-tab="explore" aria-current="page"><span class="railic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/></svg></span><span class="raillbl" data-i18n="tab.explore">探索</span></a>
    <a class="railtab" href="/saved" data-nav data-tab="saved"><span class="railic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg><span class="badge-n" data-saved-count hidden></span></span><span class="raillbl" data-i18n="tab.saved">收藏</span></a>
    <a class="railtab" href="/me" data-nav data-tab="me"><span class="railic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span><span class="raillbl" data-i18n="tab.me">我的</span></a>
  </div>
  <div class="grow"></div>
  <div class="railfoot" id="railFoot"></div>
</nav>

<!-- Phone (≤820px): the top app bar. -->
<header class="appbar" id="appbar">
  <button class="iconbtn appbar-back" id="appbarBack" type="button" data-back hidden aria-label="返回" data-i18n-aria="detail.back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg></button>
  <a class="brand" href="/" data-nav>
    <svg class="brandmark" aria-hidden="true"><use href="#cp-mark"/></svg>
    <span class="wordmark">campuspass</span><span class="wordmark-zh i18n-zh">校園優惠</span>
  </a>
  <p class="appbar-title" id="appbarTitle" aria-hidden="true"></p>
  <div class="appbar-actions" id="appbarActions"></div>
</header>

<div class="shell" id="shell">
  <main id="main" class="main" tabindex="-1">
    <section class="view" id="view-explore" aria-labelledby="exploreTitle">
      <div class="col">
        <div class="pagehead">
          <h1 id="exploreTitle" class="pagetitle" data-i18n="explore.title">探索優惠</h1>
          <p class="pagelede" data-i18n="explore.lede">整理學校、學院、系所與學生組織公告的特約優惠。</p>
        </div>
        <div class="toolbar" id="toolbar">
          <div class="searchbar" role="search">
            <svg class="ic qicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
            <input id="q" class="search" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
              aria-label="搜尋優惠" data-i18n-aria="search.label" placeholder="搜尋商家、優惠或來源" data-i18n-ph="search.placeholder">
            <kbd class="qkbd" aria-hidden="true">/</kbd>
            <button class="qclear" id="qclear" type="button" hidden aria-label="清除搜尋" data-i18n-aria="search.clear"></button>
          </div>
          <!-- Desktop with a mouse: ‹ › at the masked edges reach the pills that don't fit (keyboard
               and touch scroll the row itself, so the buttons are out of the tab order). -->
          <div class="pillwrap" id="catWrap">
            <button class="pillarrow l" type="button" tabindex="-1" aria-hidden="true" title="往左捲動類別" data-i18n-title="pills.prev"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg></button>
            <div class="pills" id="cats" role="group" aria-label="類別" data-i18n-aria="filter.categories"></div>
            <button class="pillarrow r" type="button" tabindex="-1" aria-hidden="true" title="往右捲動類別" data-i18n-title="pills.next"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </div>
        <div class="filterrow" id="filterRow" role="group" aria-label="篩選條件" data-i18n-aria="filter.filters"></div>
        <ul class="list" id="list" aria-label="優惠列表" data-i18n-aria="list.label" aria-busy="true"></ul>
        <div class="listfoot" id="exploreFoot"></div>
      </div>
    </section>

    <section class="view" id="view-saved" aria-labelledby="savedTitle" hidden>
      <div class="col">
        <div class="pagehead pagehead-solo">
          <h1 id="savedTitle" class="pagetitle" data-i18n="saved.title">收藏</h1>
          <p class="pagelede" data-i18n="saved.lede">你收藏的優惠，已過期的也會保留。</p>
        </div>
        <div id="savedBody"></div>
      </div>
    </section>

    <section class="view" id="view-me" aria-labelledby="meTitle" hidden>
      <div class="col col-page">
        <div class="pagehead pagehead-solo">
          <h1 id="meTitle" class="pagetitle" data-i18n="me.title">我的</h1>
        </div>
        <div id="meBody" class="mebody"></div>
      </div>
    </section>

    <!-- /merchants: the public pitch and lead form. -->
    <section class="view" id="view-merchants" aria-labelledby="merchantsTitle" hidden>
      <div class="col col-page">
        <div class="pagehead pagehead-solo">
          <h1 id="merchantsTitle" class="pagetitle" data-i18n="merchants.title">商家合作</h1>
        </div>
        <div id="merchantsBody" class="mebody"></div>
      </div>
    </section>

    <!-- /m/<key>: a shop's private confirm page; /r/<code>: what a scanned pass QR opens.
         Minimal chrome (no tabs): this runs on a shop's counter phone. -->
    <section class="view" id="view-shop" aria-label="店家確認" data-i18n-aria="shop.title" hidden>
      <div class="col col-page col-min"><div id="shopBody" class="minibody"></div></div>
    </section>
    <section class="view" id="view-scan" aria-label="確認優惠使用" data-i18n-aria="scan.title" hidden>
      <div class="col col-page col-min"><div id="scanBody" class="minibody"></div></div>
    </section>

    <!-- Any other path: a not-found state, with the URL kept as typed. -->
    <section class="view" id="view-notfound" aria-labelledby="notfoundTitle" hidden>
      <div class="col col-page"><div id="notfoundBody"></div></div>
    </section>
  </main>

  <aside class="detail" id="detail" aria-labelledby="detailName" aria-hidden="true">
    <div class="dhead" id="dhead"></div>
    <div class="dbody" id="detailBody"></div>
    <!-- 使用優惠: app.js moves it into #detailBody right after the deal's heading (.dhero), so the
         DOM and tab order read name → action. A phone pins it as the bottom bar; a desktop shows it in flow. -->
    <div class="duse" id="detailUse" hidden></div>
  </aside>
</div>

<!-- Phone: the bottom tab bar, with the surface fade above it instead of a border. -->
<div class="tabbar-fade" aria-hidden="true"></div>
<nav class="tabbar" id="tabbar" aria-label="分頁" data-i18n-aria="nav.tabs">
  <a class="tab" href="/" data-nav data-tab="explore" aria-current="page"><span class="tabic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/></svg></span><span class="tablbl" data-i18n="tab.explore">探索</span></a>
  <a class="tab" href="/saved" data-nav data-tab="saved"><span class="tabic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg><span class="badge-n" data-saved-count hidden></span></span><span class="tablbl" data-i18n="tab.saved">收藏</span></a>
  <a class="tab" href="/me" data-nav data-tab="me"><span class="tabic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span><span class="tablbl" data-i18n="tab.me">我的</span></a>
</nav>

<div id="toast" class="toast" popover="manual" aria-hidden="true"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<noscript>
  <div class="noscript">CampusPass 需要啟用 JavaScript。<br>CampusPass needs JavaScript to run.</div>
</noscript>
</body>
</html>
