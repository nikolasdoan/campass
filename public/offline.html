<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>離線 · CampusPass</title>
<!-- The status bar matches this page's background (--page), light or dark with the system… -->
<meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171B" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<script>
/* …unless the reader picked a theme in the app (localStorage cp_theme): then that theme, for
   the page and the status bar both, applied before paint like index.html does. */
(function () {
  try {
    var t = localStorage.getItem('cp_theme');
    if (t !== 'light' && t !== 'dark') return;
    document.documentElement.dataset.theme = t;
    var c = t === 'dark' ? '#17171B' : '#FAFAFA';
    var m = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < m.length; i++) m[i].setAttribute('content', c);
  } catch (e) { /* storage blocked: follow the system */ }
})();
</script>
<style>
:root{ color-scheme:light;
 --page:#FAFAFA; --surface:#FFFFFF; --ink:#1D1D1F; --ink-2:#48484A; --muted:#6E6E73; --line:#E5E5E7; --chip:#F5F5F7;
 --dot:#8C52FF; --accent-fill:#6B3FCC; --on-accent:#FFFFFF;
 --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
 --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","Helvetica Neue",Helvetica,"PingFang TC","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
 --dur-tap:120ms; --dur-ui:200ms; --ease-standard:cubic-bezier(.4,0,.2,1); }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ color-scheme:dark;
 --page:#17171B; --surface:#202026; --ink:#FAFAFA; --ink-2:#C7C7CC; --muted:#A1A1A6; --line:#35353D; --chip:#2A2A31;
 --dot:#A978FF; --accent-fill:#A978FF; --on-accent:#0A0A0A; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.55); } }
:root[data-theme="dark"]{ color-scheme:dark;
 --page:#17171B; --surface:#202026; --ink:#FAFAFA; --ink-2:#C7C7CC; --muted:#A1A1A6; --line:#35353D; --chip:#2A2A31;
 --dot:#A978FF; --accent-fill:#A978FF; --on-accent:#0A0A0A; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.55); }
@media (prefers-reduced-motion:reduce){ :root{ --dur-tap:0ms; --dur-ui:0ms; } }
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{ margin:0; background:var(--page); color:var(--ink); font:15px/1.5 var(--sans); letter-spacing:-0.01em;
  display:grid; place-items:center;
  padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
main{ width:min(420px,100%); padding:32px 24px 28px; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; box-shadow:var(--shadow); text-align:center; }
.mark{ width:56px; height:56px; margin:0 auto 18px; display:grid; place-items:center; border-radius:14px;
  background:color-mix(in srgb,var(--dot) 13%,transparent); color:var(--dot); }
.mark svg{ width:34px; height:auto; display:block; }
h1{ margin:0 0 6px; font-size:20px; line-height:1.3; font-weight:600; letter-spacing:-0.02em; }
p{ margin:0; color:var(--ink-2); }
p.en{ margin-top:2px; font-size:13px; color:var(--muted); }
button{ margin-top:22px; min-height:44px; padding:10px 28px; border:0; border-radius:999px; cursor:pointer;
  background:var(--accent-fill); color:var(--on-accent); font:600 15px var(--sans);
  transition:transform var(--dur-tap) var(--ease-standard), opacity var(--dur-ui) var(--ease-standard); }
button:active{ transform:scale(.97); }
button:focus-visible{ outline:2px solid var(--dot); outline-offset:3px; }
button[aria-busy="true"]{ opacity:.6; }
.status{ min-height:18px; margin-top:12px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg viewBox="66 96 380 320" fill="currentColor"><defs><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect x="86" y="146" width="340" height="220" rx="30" fill="#fff"/><g fill="#000"><circle cx="322" cy="146" r="28"/><circle cx="322" cy="366" r="28"/><circle cx="322" cy="200" r="9"/><circle cx="322" cy="238" r="9"/><circle cx="322" cy="276" r="9"/><circle cx="322" cy="314" r="9"/><rect x="132" y="210" width="128" height="26" rx="13"/><rect x="132" y="262" width="84" height="26" rx="13"/></g></mask></defs><g transform="rotate(-12 256 256)"><rect width="512" height="512" mask="url(#m)"/></g></svg>
  </div>
  <h1>目前離線，請連線後再試</h1>
  <p class="en" lang="en">You're offline. Please reconnect and try again.</p>
  <button type="button" id="retry">重新整理 <span lang="en">· Retry</span></button>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  var btn = document.getElementById('retry');
  var status = document.getElementById('status');
  function retry() {
    btn.setAttribute('aria-busy', 'true');
    status.textContent = '連線中… Connecting…';
    location.reload();
  }
  btn.addEventListener('click', retry);
  /* Back online by itself: try again without waiting for a tap. */
  addEventListener('online', retry);
})();
</script>
</body>
</html>
