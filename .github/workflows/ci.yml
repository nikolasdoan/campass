name: CI

# Local-only checks: local D1 (Miniflare), mock Google, no Cloudflare credentials.
on:
  push:
    branches: ["claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # tests/ui.mjs launches /opt/pw-browsers/chromium-<rev>/chrome-linux/chrome
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check openpyxl

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Seed is committed and up to date
        run: |
          python3 scripts/import_deals.py
          git diff --exit-code data/deals.json seed/deals.sql

      - name: Local D1 (migrations + seed)
        run: |
          cat > .dev.vars <<'EOF'
          DEV_LOGIN=true
          ADMIN_TOKEN=change-me
          GOOGLE_CLIENT_ID=mock-client-id
          GOOGLE_CLIENT_SECRET=ci
          GOOGLE_MOCK_URL=http://localhost:9876
          ALLOW_HTTP=true
          EOF
          npx wrangler d1 migrations apply campuspass --local
          npx wrangler d1 execute campuspass --local --file seed/deals.sql

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Prepare browser directory
        run: sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" && sudo chown "$USER" "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: /opt/pw-browsers
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start mock Google and wrangler dev
        id: servers
        run: |
          nohup node tests/mock-google.mjs > mock-google.log 2>&1 &
          # npm run dev = wrangler dev --port 8787 --local-upstream localhost:8787. Without the upstream flag the
          # pass.tecxmate.com custom domain makes local requests look like production (OAuth redirect goes there).
          nohup npm run dev > wrangler-dev.log 2>&1 &
          timeout 120 bash -c 'until curl -sf http://localhost:8787/api/me > /dev/null; do sleep 2; done'

      # Each suite runs even if an earlier one failed, so one red suite doesn't hide the others.
      - name: API tests
        if: ${{ !cancelled() && steps.servers.outcome == 'success' }}
        run: npm run test:api

      - name: UI tests
        if: ${{ !cancelled() && steps.servers.outcome == 'success' }}
        run: npm run test:ui

      - name: PWA tests
        if: ${{ !cancelled() && steps.servers.outcome == 'success' }}
        # Lets Playwright's offline/route-abort reach the service worker (else offline checks pass falsely).
        env:
          PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: "1"
        run: npm run test:pwa

      - name: Admin dashboard tests
        if: ${{ !cancelled() && steps.servers.outcome == 'success' }}
        run: node tests/admin.mjs

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            wrangler-dev.log
            mock-google.log
          if-no-files-found: ignore
          retention-days: 7
